<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: ステッカー風のポップな1カラム。太い縁取り＋ずらした影の丸いパーツで、毒舌とのギャップを出す */
:root{
  --bg:#fff4f8; --card:#ffffff; --ink:#3a2348; --mute:#8a7596;
  --pink:#ff6fa8; --pinksoft:#ffd9e8; --mint:#7fdcc4; --butter:#ffd86b; --sky:#9ec9ff; --lilac:#c9a8ff;
  --shadow:#3a2348;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22152c;--card:#2f1f3b;--ink:#fbeefa;--mute:#c3acd0;--pinksoft:#5a2a47;--shadow:#0e0712;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#22152c;--card:#2f1f3b;--ink:#fbeefa;--mute:#c3acd0;--pinksoft:#5a2a47;--shadow:#0e0712;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.75;
  background-image:radial-gradient(var(--pinksoft) 2px,transparent 2.5px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.pop{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:4px 5px 0 var(--shadow)}
.btn{border:3px solid var(--ink);border-radius:999px;box-shadow:3px 4px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--shadow)}
/* タイトル */
.logo{text-align:center;padding:24px 0 8px;position:relative}
.logo h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,17vw,84px);line-height:1.05;margin:0;letter-spacing:.02em;
  color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 var(--shadow)}
.logo h1 span{display:inline-block}
.logo h1 span:nth-child(2){color:var(--butter);transform:rotate(4deg)}
.logo h1 span:nth-child(3){color:var(--mint);transform:rotate(-3deg)}
.logo h1 span:nth-child(4){color:var(--sky);transform:rotate(5deg)}
.sticker{display:inline-block;margin-top:14px;background:var(--butter);color:#3a2348;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-weight:800;font-size:14px;transform:rotate(-3deg)}
.blocks{display:grid;gap:18px;margin-top:26px}
.group{padding:16px}
.group h2{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--mute);letter-spacing:.08em;text-align:center}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{background:var(--card);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.choice button b{font-family:var(--display);font-weight:400;font-size:20px}
.choice button span{font-size:12px;color:var(--mute)}
.choice button[aria-pressed="true"]{background:var(--pink);color:#fff}
.choice button[aria-pressed="true"] span{color:#fff}
.go{display:block;width:100%;background:var(--mint);color:#3a2348;padding:16px;font-family:var(--display);font-size:22px}
.sub{display:block;width:100%;background:var(--card);padding:12px;font-weight:800;font-size:16px}
/* 質問 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{font-weight:800;font-size:13px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--card);border:3px solid var(--ink);border-radius:999px;margin:12px 0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .25s}
.qcard{padding:28px 20px;text-align:center;margin-bottom:18px}
.qcard .n{font-family:var(--display);font-size:28px;color:var(--pink);line-height:1}
.q{font-size:20px;font-weight:800;line-height:1.6;margin:12px 0 0;min-height:3.2em;text-wrap:balance}
.scale{display:grid;gap:10px}
.scale button{background:var(--card);padding:11px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;text-align:left}
.scale button .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none}
.scale button:nth-child(1) .dot{background:var(--sky)} .scale button:nth-child(2) .dot{background:var(--lilac)}
.scale button:nth-child(3) .dot{background:var(--card)} .scale button:nth-child(4) .dot{background:var(--butter)}
.scale button:nth-child(5) .dot{background:var(--pink)}
.scale button.on{background:var(--pinksoft)}
.qnav{display:flex;justify-content:space-between;margin-top:16px}
.link{background:none;border:0;color:var(--mute);font-weight:700;font-size:14px;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
/* 結果・一覧のアバター（イラストが届いたら差し替え） */
.ava{border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--display);color:#3a2348;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
/* 結果 */
.hero{padding:26px 20px 22px;text-align:center;position:relative}
.hero .ava{width:132px;height:132px;margin:0 auto;font-size:54px;box-shadow:3px 4px 0 var(--shadow)}
.badge{position:absolute;top:16px;right:14px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:800;font-size:13px;transform:rotate(8deg)}
.codepill{display:inline-block;margin:18px 0 6px;background:var(--butter);color:#3a2348;border:3px solid var(--ink);border-radius:999px;padding:2px 18px;font-family:var(--display);font-size:clamp(28px,9vw,38px);letter-spacing:.06em;line-height:1.3}
.codepill small{font-size:.55em}
.tname{font-family:var(--display);font-weight:400;font-size:clamp(22px,6.5vw,28px);line-height:1.35;margin:6px 0 14px;text-wrap:balance}
.blurb{background:var(--pinksoft);border-radius:18px;padding:14px 16px;margin:0;text-align:left}
.sec{font-family:var(--display);font-weight:400;font-size:18px;text-align:center;margin:30px 0 14px}
.axes{display:grid;gap:14px}
.axis{padding:16px 18px}
.axhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.axhead h3{margin:0;font-size:17px;font-weight:800}
.lv{font-size:12px;font-weight:800;background:var(--lilac);color:#3a2348;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums}
.meter{position:relative;height:16px;background:var(--bg);border:3px solid var(--ink);border-radius:999px;margin:12px 0 4px}
.meter s{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--mute);opacity:.5}
.meter i{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);transform:translate(-50%,-50%)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);font-weight:700}
.ends .win{color:var(--pink)}
.axis p{margin:10px 0 0}
.actions{display:grid;gap:12px;margin-top:26px}
.copied{font-size:13px;font-weight:700;color:var(--pink);text-align:center;min-height:1.4em}
/* タイプ一覧 */
.tabs{margin-top:14px}
.tlist{display:grid;gap:12px;margin-top:18px}
.tcard{padding:0;overflow:hidden}
.tcard summary{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer}
.tcard summary::-webkit-details-marker{display:none}
.tcard .ava{width:60px;height:60px;font-size:26px}
.tcard .meta{min-width:0;flex:1}
.tcard .c{font-family:var(--display);font-size:14px;color:var(--pink);letter-spacing:.06em}
.tcard .nm{font-weight:800;font-size:16px;line-height:1.4}
.tcard .plus{font-family:var(--display);font-size:22px;color:var(--mute);transition:transform .2s}
.tcard[open] .plus{transform:rotate(45deg)}
.tcard p{margin:0;padding:0 16px 16px;font-size:15px}
.mixbtn{display:block;width:100%;background:var(--butter);color:#3a2348;padding:12px;font-weight:800;font-size:16px}
.mixbtn small{display:block;font-size:12px;font-weight:700;opacity:.75}
.pcard{padding:16px}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pcard .ph b{font-family:var(--display);font-weight:400;font-size:18px}
.pcode{font-family:var(--display);font-size:16px;color:var(--pink);letter-spacing:.06em}
.prow{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:8px;padding:5px 0}
.pname{font-size:13px;font-weight:800;color:var(--mute)}
.pseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.pbtn{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 8px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.pbtn b{font-family:var(--display);font-weight:400;font-size:15px}
.pbtn span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn[aria-pressed="true"]{background:var(--pink);color:#fff}
.pnow{font-weight:800;color:var(--pink);font-size:15px;margin:-4px 0 10px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:6px 8px;display:flex;align-items:center;gap:8px;text-align:left;min-width:0}
.tbtn .ava{width:34px;height:34px;font-size:15px;border-width:2px}
.tbtn .tx{min-width:0;font-size:12px;font-weight:700;line-height:1.35}
.tbtn small{display:block;font-family:var(--display);font-size:11px;color:var(--pink);letter-spacing:.05em}
.tbtn[aria-pressed="true"]{background:var(--pinksoft);border-color:var(--pink);box-shadow:2px 3px 0 var(--shadow)}
.mixnote{text-align:center;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 0}
.mixhero{padding:26px 20px 22px;text-align:center;position:relative}
.mixcodes{display:inline-block;line-height:1.5;background:var(--butter);color:#3a2348;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-family:var(--display);font-size:clamp(15px,4.6vw,20px);letter-spacing:.04em}
.mixtitle{font-family:var(--display);font-weight:400;font-size:clamp(28px,9vw,40px);line-height:1.3;margin:18px 0 14px;text-wrap:balance;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.verdictbox{padding:18px;text-align:center;background:var(--mint);color:#3a2348;margin-top:14px}
.verdictbox b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.verdictbox p{margin:6px 0 0;text-align:left}
.shade{position:fixed;inset:0;background:#1b0f2480;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);z-index:21;border-radius:28px 28px 0 0;border-bottom:0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:20px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{background:none;border:0;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 0;cursor:pointer;min-width:0}
.sic{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;box-shadow:2px 3px 0 var(--shadow)}
.sbtn:active .sic{transform:translate(2px,3px);box-shadow:none}
.imgprev{display:block;width:auto;max-width:100%;max-height:52vh;margin:0 auto;border-radius:16px;border:3px solid var(--ink);background:var(--bg);min-height:120px}
#imgsheet{max-height:100%;overflow-y:auto}
.iglink{text-align:center;font-weight:800;color:var(--pink)}
.sheet .copied{margin:0}
@media (prefers-reduced-motion:reduce){.bar i,.btn,.tcard .plus{transition:none}}
</style>
</head>
<body>
<main class="app">
  <section id="intro">
    <div class="logo">
      <h1><span>辛</span><span>辣</span><span>診</span><span>断</span></h1>
      <div class="sticker">ほめません。</div>
    </div>
    <div class="blocks">
      <div class="group pop">
        <h2>テーマ</h2>
        <div class="choice" id="themeSel">
          <button class="btn" id="th-human" aria-pressed="true" data-v="human"><b>人間性</b><span>性格の欠点</span></button>
          <button class="btn" id="th-love" aria-pressed="false" data-v="love"><b>恋愛</b><span>恋人としての欠点</span></button>
        </div>
      </div>
      <div class="group pop">
        <h2>モード</h2>

        </div>
      </div>
      <button class="btn go" id="start">診断スタート</button>
      <button class="btn mixbtn" id="openMix">掛け合わせ診断<small>人間性と恋愛、両方のタイプが分かった人向け</small></button>
      <button class="btn sub" id="openTypes">全タイプ一覧を見る</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="top"><span class="chip" id="qkind">人間性・お手軽</span><span class="chip" id="pnum">1 / 20</span></div>
    <div class="bar"><i id="pbar" style="width:0"></i></div>

    <div class="scale" id="scale"></div>
    <div class="qnav"><button class="link" id="back">前の質問</button><button class="link" id="quit">最初に戻る</button></div>
  </section>

  <section id="result" hidden>
    <div class="hero pop">
      <span class="badge" id="badge">辛辣</span>
      <div class="ava" id="rava"></div>
      <div class="codepill" id="code"></div>
      <h2 class="tname" id="verdict"></h2>
      <p class="blurb" id="blurb"></p>
    </div>
    <h2 class="sec">軸ごとのダメなところ</h2>
    <div class="axes" id="items"></div>
    <div class="actions">
      <button class="btn go" id="copy">結果をシェアする</button>
      <button class="btn mixbtn" id="img">画像で保存する</button>
            <button class="btn sub" id="again">トップに戻る</button>
    </div>
  </section>

  <section id="types" hidden>
    <div class="logo" style="padding-top:8px"><div class="sticker" style="font-size:18px">全32タイプ</div></div>
    <div class="choice tabs" id="typeTab">
      <button class="btn" aria-pressed="true" data-v="human"><b>人間性</b><span>16タイプ</span></button>
      <button class="btn" aria-pressed="false" data-v="love"><b>恋愛</b><span>16タイプ</span></button>
    </div>
    <div class="tlist" id="tlist"></div>
    <div class="actions"><button class="btn sub" id="typesBack">トップに戻る</button></div>
  </section>
  <section id="mix" hidden>
    <div class="logo" style="padding-top:8px"><div class="sticker" style="font-size:18px">掛け合わせ診断</div></div>
    <p class="mixnote">人間性と恋愛、それぞれで出たタイプを選んでください。</p>
    <div class="blocks" style="margin-top:16px">
      <div class="pcard pop"><div class="ph"><b>人間性</b></div><div class="pnow" id="pc-human"></div><div class="tgrid" id="pick-human"></div></div>
      <div class="pcard pop"><div class="ph"><b>恋愛</b></div><div class="pnow" id="pc-love"></div><div class="tgrid" id="pick-love"></div></div>
      <button class="btn go" id="mixGo">掛け合わせる</button>
      <button class="btn sub" id="mixBack">トップに戻る</button>
    </div>
  </section>

  <section id="mixres" hidden>
    <div class="mixhero pop">
      <span class="badge">最悪の組み合わせ</span>
      <div class="mixcodes" id="mixcodes"></div>
      <h2 class="mixtitle" id="mixtitle"></h2>
      <p class="blurb" id="mixlead"></p>
    </div>
    <h2 class="sec">掛け合わせると出てくるボロ</h2>
    <div class="axes" id="mixparts"></div>
    <div class="verdictbox pop"><b id="mixverdict"></b><p id="mixverdict2"></p></div>
    <div class="actions">
      <button class="btn go" id="mixCopy">結果をシェアする</button>
      <button class="btn mixbtn" id="mixImg">画像で保存する</button>
            <button class="btn sub" id="mixRedo">タイプを選び直す</button>
      <button class="btn sub" id="mixTop">トップに戻る</button>
    </div>
  </section>
</main>

<div class="shade" id="shade2" hidden></div>
<div class="sheet pop" id="imgsheet" hidden role="dialog" aria-label="結果を画像で保存">
  <h2>結果を画像で保存</h2>
  <img class="imgprev" id="imgprev" alt="診断結果の画像">

</div>

    <button class="sbtn" id="sh-ig"><span class="sic" style="background:linear-gradient(135deg,#feda75,#d62976,#4f5bd5);color:#fff">IG</span>Instagram</button>

  <button class="btn sub" id="shClose">閉じる</button>
</div>

<script>

const DATA={
human:{

// イラストが届いたら、型番をキーに画像URL（data: URI など）を入れる
const ILLUST={human:{},love:{}};
const PALETTE=["#ff9ec4","#ffd86b","#7fdcc4","#9ec9ff","#c9a8ff","#ffb38a"];
const OPT=["まったく当てはまらない","あまり当てはまらない","どちらともいえない","やや当てはまる","とても当てはまる"];
const $=id=>document.getElementById(id);
let theme="human",mode="quick",Q=[],ans=[],cur=0,lastText="";

function animalOf(name){return name.split("の").pop()}
function avatar(el,th,code,name){
  const src=ILLUST[th][code];
  el.style.background=PALETTE[[...code].reduce((a,c)=>a+c.charCodeAt(0),0)%PALETTE.length];
  el.innerHTML=src?`<img src="${src}" alt="${name}">`:animalOf(name).slice(0,1);
}
function sel(group,val){[...group.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===val))}
$("themeSel").onclick=e=>{const b=e.target.closest("button");if(b){theme=b.dataset.v;sel($("themeSel"),theme)}};
$("modeSel").onclick=e=>{const b=e.target.closest("button");if(b){mode=b.dataset.v;sel($("modeSel"),mode)}};

function show(id){["intro","quiz","result","types","mix","mixres"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function build(){
  const d=DATA[theme],n=mode==="quick"?4:10,all=[...d.dims,d.sfx];Q=[];
  for(let i=0;i<n;i++)all.forEach((dim,k)=>{const s=dim.items[i];Q.push({k,rev:s[0]==="-",t:s.slice(1)})});
  ans=new Array(Q.length).fill(0);cur=0;
  $("qkind").textContent=(theme==="human"?"人間性":"恋愛")+"・"+(mode==="quick"?"お手軽":"しっかり");
}
function render(){
  $("pnum").textContent=(cur+1)+" / "+Q.length;
  $("qn").textContent="Q"+(cur+1);
  $("pbar").style.width=(cur/Q.length*100)+"%";
  $("qtext").textContent=Q[cur].t;
  $("scale").innerHTML="";
  OPT.forEach((o,i)=>{
    const b=document.createElement("button");b.id="opt"+i;b.className="btn";
    b.innerHTML='<span class="dot"></span>'+o;
    if(ans[cur]===i+1)b.classList.add("on");
    b.onclick=()=>{ans[cur]=i+1;b.classList.add("on");setTimeout(()=>{cur<Q.length-1?(cur++,render()):finish()},160)};
    $("scale").appendChild(b);
  });
  $("back").style.visibility=cur?"visible":"hidden";
}
function finish(){
  const d=DATA[theme],all=[...d.dims,d.sfx],sum=[0,0,0,0,0],cnt=[0,0,0,0,0];
  Q.forEach((q,i)=>{sum[q.k]+=q.rev?6-ans[i]:ans[i];cnt[q.k]++});

  $("imgmsg").textContent="画像を作っています…";$("imgprev").removeAttribute("src");$("imgsave").hidden=true;
  $("shade2").hidden=false;$("imgsheet").hidden=false;
  const cv=await buildCard(spec);
  cv.toBlob(b=>{
    cardBlob=b;cardName=filename;$("imgprev").src=URL.createObjectURL(b);
    $("imgsave").hidden=false;
    $("imgsave").textContent=canShareFile()?"画像を保存・シェアする":"画像を保存する";
    $("imgmsg").textContent="";
  },"image/png");
}
async function saveImage(){
  if(!cardBlob)return;
  // スマホ：共有メニューから「画像を保存」やInstagramに送れる
  if(canShareFile()){
    try{await navigator.share({files:[new File([cardBlob],cardName,{type:"image/png"})],text:"#辛辣診断 "+SHARE_URL});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  // パソコン：そのままダウンロード
  const a=document.createElement("a");a.href=URL.createObjectURL(cardBlob);a.download=cardName;document.body.appendChild(a);a.click();a.remove();
  $("imgmsg").textContent="保存しました。うまくいかない場合は画像を長押し（右クリック）して保存してください。";
}
function closeImage(){$("shade2").hidden=true;$("imgsheet").hidden=true}
$("img").onclick=()=>openImage(lastCard,"辛辣診断_"+(lastCard?lastCard.code:"")+".png");
$("mixImg").onclick=()=>openImage(lastMixCard,"辛辣診断_掛け合わせ.png");
$("imgsave").onclick=saveImage;$("imgClose").onclick=closeImage;$("shade2").onclick=closeImage;
</script>
</body>
</html>
